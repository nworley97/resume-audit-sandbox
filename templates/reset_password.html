{% extends "base_auth.html" %}
{% block title %}Reset Password - ALTERA{% endblock %}
{% block content %}
<div class="w-full max-w-md bg-white shadow-lg rounded-lg p-10">
  <!-- Icon -->
  <div class="mb-4 flex justify-center">
    <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-primary/10">
      <svg class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 10-8 0v2"></path>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <h2 class="text-xl font-semibold mb-2 text-center" style="font-family: 'Poppins', sans-serif;">Choose a new password</h2>
  <p class="text-sm text-slate mb-6 text-center" style="font-family: 'Inter', sans-serif;">
    Your new password must be at least 8 characters.
  </p>

  <form method="post" action="{{ url_for('reset_password', token=token) }}" class="space-y-4 text-left">
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
      <input id="password" name="password" type="password"
             placeholder="Enter a new password"
             class="w-full rounded-lg border border-slate px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
             minlength="8" required>
    </div>
    <div>
      <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password"
             placeholder="Re-enter the new password"
             class="w-full rounded-lg border border-slate px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
             minlength="8" required>
    </div>
    <button type="submit"
            class="w-full bg-primary text-white py-2 rounded-lg hover:bg-blue-600 transition">
      Reset password
    </button>
  </form>

  <!-- Footer -->
  <div class="mt-6 text-xs text-slate text-center">
    <a href="https://alterasf.com/" target="_blank" rel="noopener noreferrer"
       class="hover:text-slate-700 hover:underline cursor-pointer transition-colors duration-200"
       style="font-family: 'Inter', sans-serif;">
      Powered by AlteraSF
    </a>
  </div>
</div>
{% endblock %}
